meta:
  docker-registry-config: &docker-registry-config
    username: concourse
    password: ((concourse_artifactory_password))

  s3-resource-simple-git: &s3-resource-simple-git
    uri: https://github.com/Pix4D/s3-resource-simple.git

  gh-status-handlers: &gh-status-handlers
      on_success:
        put: gh-status
        inputs: [s3-resource-simple.git]
        no_get: true
        params: {state: success}
      on_failure:
        put: gh-status
        inputs: [s3-resource-simple.git]
        no_get: true
        params: {state: failure}
      on_error:
        put: gh-status
        inputs: [s3-resource-simple.git]
        no_get: true
        params: {state: error}
      on_abort:
        put: gh-status
        inputs: [s3-resource-simple.git]
        no_get: true
        # The GH status API doesn't have "abort", so we use the closest state.
        params:
          state: error

###############################################################################

resource_types:

- name: cogito
  type: registry-image
  check_every: 24h
  source:
    repository: pix4d/cogito
    tag: latest

- name: s3-resource-simple
  type: registry-image
  # This is a resource type image that we build and push to our registry from the same pipeline and
  # at the same time we need to run the tests using the same resource type image we just built.
  # We must ensure that the same image digest that we just built is used in tests. This is impossible
  # to explicitly configure from the pipeline perspective, because we don't much control over the version
  # of the resource type. Concourse will schedule the check and get for the resource type on its own.
  # Even putting check_every to a very small value, the risk of the race condition is still there. The only
  # viable workaround so far is to set check_every to never. This will trigger the check ALWAYS. 
  # NOTE that we are still not 100% safe from the race condition, because if another build pushes the new digest
  # while our test jobs are waiting for the worker, we can still use the wrong digest. Sadly, this is the best
  # we can do.
  check_every: never
  source:
    <<: *docker-registry-config
    repository: docker.ci.pix4d.com/s3-resource-simple
    tag: ((docker_tag))

###############################################################################

resources:

- name: gh-status
  type: cogito
  check_every: never
  source:
    owner: pix4d
    repo: s3-resource-simple
    access_token: ((github_repo_status_token))
    gchat_webhook: ((gchat_hook))

- name: s3-resource-simple.git
  type: git
  webhook_token: ((concourse_gh_webhook))
  source:
    <<: *s3-resource-simple-git
    branch: ((branch))
    disable_ci_skip: true # This is needed to let the git resource optimize the check step.

- name: s3-resource-simple.docker
  type: registry-image
  check_every: never
  source:
    <<: *docker-registry-config
    repository: docker.ci.pix4d.com/s3-resource-simple
    tag: ((docker_tag))

- name: bucket.s3simple
  type: s3-resource-simple
  check_every: never
  source:
    bucket: ci-pix4d-concourse-pipeline
    region_name: eu-west-1
    access_key_id: ((concourse_user_access_key))
    secret_access_key: ((concourse_user_secret_key))
    # For this particular pipeline we use the /artifacts paths also for the master branch,
    # so that the files uploaded by the tests will expire and be removed periodically.
    path: artifacts/s3-resource-simple/((branch))/
    # DANGER DANGER DANGER
    # For vast the majority of your use cases, DO NOT enable downloading (do NOT set
    # sync: true)! It will download, on each `get` (explicit and implicit) EVERYTHING
    # in the bucket below the `path` !
    # We enable it only because this pipeline is special: it is testing the resource itself.
    sync: true # DANGER - DO NOT COPY THIS LINE - DANGER
    put_options:
      # copy the source directory recursively.
      - --recursive

###############################################################################

jobs:

- name: build
  <<: *gh-status-handlers
  max_in_flight: 1
  plan:
  - get: s3-resource-simple.git
    trigger: true
  - put: gh-status
    inputs: [s3-resource-simple.git]
    no_get: true
    params: {state: pending}
  - task: build-final-img
    privileged: true
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: concourse/oci-build-task
      inputs:
      - name: s3-resource-simple.git
      outputs:
      - name: image
      run:
        path: build
    params:
      CONTEXT: s3-resource-simple.git
      DOCKERFILE: s3-resource-simple.git/Dockerfile
      REGISTRY_MIRRORS: concourse:((concourse_artifactory_password))@dockerhub.ci.pix4d.com
  - put: s3-resource-simple.docker
    inputs: [image, s3-resource-simple.git]
    no_get: true
    params:
      image: image/image.tar

- name: test-put
  <<: *gh-status-handlers
  max_in_flight: 1
  plan:
  - get: s3-resource-simple.git
    trigger: true
    passed: [build]
  - put: gh-status
    inputs: [s3-resource-simple.git]
    no_get: true
    params: {state: pending}
  - task: test-put
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: busybox
      inputs:
      - name: s3-resource-simple.git
      outputs:
      - name: out
      run:
        path: s3-resource-simple.git/ci/tasks/test-put.sh
  - put: bucket.s3simple
    inputs: [out]
    no_get: true
    params:
      dir: out

- name: test-get
  <<: *gh-status-handlers
  max_in_flight: 1
  plan:
  - get: s3-resource-simple.git
    trigger: true
    passed: [test-put]
  - get: bucket.s3simple
    trigger: true
    passed: [test-put]
  - put: gh-status
    inputs: [s3-resource-simple.git]
    no_get: true
    params: {state: pending}
  - task: test-get
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: busybox
      inputs:
      - name: s3-resource-simple.git
      - name: bucket.s3simple
      run:
        path: s3-resource-simple.git/ci/tasks/test-get.sh
